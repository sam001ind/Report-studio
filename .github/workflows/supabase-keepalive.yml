name: Supabase Automatic Keep-Alive Ping

on:
  schedule:
    # Run every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC) to prevent Supabase inactivity pause
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Auth API
        run: |
          echo "Sending keep-alive heartbeat to Supabase project..."
          
          # 1. Query Database via PostgREST to keep Postgres instance active
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_qM48-2xT9rogd8JxaR8HLg_Hps-knW_" \
            "https://dxnvsmlmocxuwclibphk.supabase.co/rest/v1/configs?select=id&limit=1")
          
          # 2. Query Auth Health API
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_qM48-2xT9rogd8JxaR8HLg_Hps-knW_" \
            "https://dxnvsmlmocxuwclibphk.supabase.co/auth/v1/health")
          
          echo "Database REST Ping HTTP Status: $DB_STATUS"
          echo "Auth API Ping HTTP Status: $AUTH_STATUS"
          
          if [ "$DB_STATUS" -eq 200 ] || [ "$DB_STATUS" -eq 206 ] || [ "$AUTH_STATUS" -eq 200 ]; then
            echo "✅ Supabase project is active and alive!"
          else
            echo "⚠️ Unexpected status received (DB: $DB_STATUS, Auth: $AUTH_STATUS)"
          fi
